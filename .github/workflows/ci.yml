name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/eggship_ci

      - name: Check agent tooling adapters
        run: pnpm check:agent-tooling

      - name: Check environment tooling
        run: pnpm env:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run release validator tests
        run: pnpm test:release

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Check OpenAPI document
        run: node dist/common/openapi/check-openapi.js

      - name: Check release metadata
        run: pnpm release:check
