name: Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: eggship_it
          POSTGRES_PASSWORD: eggship_it
          POSTGRES_DB: eggship_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eggship_it -d eggship_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      APP_VERSION: 0.1.0-integration
      GIT_SHA: ${{ github.sha }}
      JWT_ACCESS_SECRET: integration-ci-jwt-access-secret-32chars
      JWT_ACCESS_TTL: '900'
      REFRESH_TOKEN_TTL: '2592000'
      INTEGRATION_TESTS_ENABLED: 'true'
      INTEGRATION_ALLOW_DESTRUCTIVE: 'true'
      TEST_DATABASE_URL: postgresql://eggship_it:eggship_it@127.0.0.1:5432/eggship_it
      TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run real infrastructure integration tests
        run: pnpm test:integration
