services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eggship
      POSTGRES_USER: eggship
      POSTGRES_PASSWORD: eggship_local
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eggship -d eggship']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://eggship:eggship_local@postgres:5432/eggship?schema=public
      APP_VERSION: 0.1.0
      GIT_SHA: local
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
